# =============================================================================
# Cluster information
# =============================================================================
cluster:
  num_generation: 1
  num_training: 1

  llm_judge:
    llm_judge_server_url: TO_BE_FILLED
    llm_judge_model: DeepSeek-V4.1-Flash-1017

  # Below 2 variables are AUTOmatically set using the above information
  gpus_per_node: null
  num_nodes: null
    
# =============================================================================
# Checkpointing
# =============================================================================
checkpointing:
  enabled: true
  metric_name: null
  higher_is_better: true
  keep_top_k: ${infinite}
  ft_keep_latest_k: ${infinite}
  save_period: 1
  ft_save_period: 1
  checkpoint_must_save_by: "67:00:06:07"
  model_save_format: "safetensors"  # DTensor backend only
  save_consolidated: false  # DTensor backend only

# =============================================================================
# GRPO Algorithm
# =============================================================================
grpo:
  num_prompts_per_step: 252  # do make sure divisibility by DP-rank
  num_generations_per_prompt: 8
  max_rollout_turns: 1
  max_num_epochs: ${infinite}
  max_num_steps: 500
  advantage_clip_low: -20
  advantage_clip_high: 20
  val_period: -1
  val_at_start: false
  val_at_end: false
  overlong_filtering: false
  max_val_samples: null
  val_batch_size: 256
  seed: 2212

  use_dynamic_sampling: false
  dynamic_sampling_max_gen_batches: 67
  batch_multiplier: 1

  reward_shaping:
    enabled: false

  reward_scaling:
    enabled: false

  async_grpo:
    enabled: true
    max_trajectory_age_steps: 1
    in_flight_weight_updates: true
    recompute_kv_cache_after_weight_updates: false

  # Advantage estimators
  advantage_estimator:
    name: "subconfigs_should_properly_configure_the advantage_estimator"
  # Advantage estimators: End

  dynamic_sampling_oversample_ratio: 1.0
  seq_logprob_error_threshold: 2

# =============================================================================
# Loss Function
# =============================================================================
loss_fn:
  reference_policy_kl_penalty: 0.0
  reference_policy_kl_type: "k3"
  kl_input_clamp_value: null
  kl_output_clamp_value: null

  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: null
  use_on_policy_kl_approximation: false
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  sequence_level_importance_ratios: false
  token_level_loss: true
  force_on_policy_ratio: true
  use_kl_in_reward: false

# =============================================================================
# Policy
# =============================================================================
policy:
  model_name: "subconfigs_should_properly_configure_the policy.model_name"
  tokenizer:
    name: "subconfigs_should_properly_configure_the policy.tokenizer.name"
    chat_template_kwargs: null
  hf_config_overrides: {}

  train_global_batch_size: ${mul:${grpo.num_prompts_per_step}, ${grpo.num_generations_per_prompt}}
  train_micro_batch_size: 1
  logprob_batch_size: ${policy.train_micro_batch_size}
  max_total_sequence_length: 8192  # should be a multiple of 128 or something
  precision: "bfloat16"
  logprob_chunk_size: ${policy.train_global_batch_size}
  offload_optimizer_for_logprob: false

  generation_batch_size: 64  # Only used in huggingface generation
  dtensor_cfg:
    enabled: false
    _v2: true
    cpu_offload: false
    sequence_parallel: false
    activation_checkpointing: false
    tensor_parallel_size: 1
    context_parallel_size: 1
    custom_parallel_plan: null

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2
    activation_checkpointing: true  # don't set this to false.

    # Parallelism
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    context_parallel_size: 1
    pipeline_model_parallel_size: 1  # Cannot be turned on due to MTP issues in the framework
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    pipeline_dtype: ${policy.precision}
    sequence_parallel: true  # Is automatically turned off when TP=1

    # MoE
    freeze_moe_router: true
    moe_router_dtype: "fp32"
    moe_router_load_balancing_type: "none"
    moe_router_bias_update_rate: 0.0  # Set to 0 due to frozen moe router
    moe_router_enable_expert_bias: true  # Can be changed
    moe_permute_fusion: true
    moe_enable_deepep: false
    moe_token_dispatcher_type: "alltoall"  # only option available in the environment
    moe_flex_dispatcher_backend: "hybridep"  # Unused due to "alltoall" setting
    moe_hybridep_num_sms: 32  # Unused due to "alltoall" setting
    moe_aux_loss_coeff: 0.0
    moe_shared_expert_overlap: false

    # Compute
    apply_rope_fusion: true
    gradient_accumulation_fusion: false
    use_fused_weighted_squared_relu: true
    bias_activation_fusion: false
    defer_fp32_logits: true

    # Logging
    track_moe_metrics: false
    moe_per_layer_logging: false
    do_not_average_loss: true
    cp_normalize: true
    calculate_per_token_loss: true
    scale_loss_by_dp_cp_size: false

    # MTP
    mtp_loss_scaling_factor: 0.0
    mtp_use_repeated_layer: true
    mtp_num_layers: null
    mtp_detach_heads: true

    optimizer:
      optimizer: "adam"
      lr: 3.0e-6
      min_lr: ${policy.megatron_cfg.optimizer.lr}
      weight_decay: 0.0
      bf16: true
      fp16: false
      params_dtype: "float32"

      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1e-8

      sgd_momentum: 0.9

      use_distributed_optimizer: true
      use_precision_aware_optimizer: true

      clip_grad: ${policy.max_grad_norm}

      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "constant"
      lr_decay_iters: null
      lr_warmup_iters: 20
      lr_warmup_init: 3.0e-7
      override_opt_param_scheduler: true

    distributed_data_parallel_config:
      grad_reduce_in_fp32: true  # BIG MODELS should probably set this to false.
      overlap_grad_reduce: false  # TODO: can this be "true"? If yes, is it a free increase in speed
      overlap_param_gather: true
      average_in_collective: false
      use_custom_fsdp: false
      data_parallel_sharding_strategy: "optim_grads_params"

    # FP8 disabled for bf16 runs. Enable for mxfp8 validation.
    fp8_cfg:
      enabled: false
      fp8: "e4m3"
      fp8_recipe: "mxfp8"
      fp8_param: false

    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1

    use_gloo_process_groups: false

    checkpoint:
      async_save: true
      ckpt_assume_constant_structure: false
      fully_parallel_save_process_group: "ep_dp"
      fully_parallel_load_process_group: "ep_dp"
      fully_parallel_load_exchange_algo: "broadcast"

    env_vars: null

  # ---------------------------------------------------------------------------
  # Sequence Packing
  # ---------------------------------------------------------------------------
  dynamic_batching:
    enabled: false
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    sequence_length_round: ${policy.make_sequence_length_divisible_by}

  sequence_packing:
    enabled: true
    train_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.train_micro_batch_size}}
    logprob_mb_tokens: ${mul:${policy.max_total_sequence_length}, ${policy.logprob_batch_size}}
    algorithm: "modified_first_fit_decreasing"
    sequence_length_round: ${policy.make_sequence_length_divisible_by}
    fuse_loss: true

  make_sequence_length_divisible_by: ${mul:${mul:${policy.megatron_cfg.tensor_model_parallel_size}, ${policy.megatron_cfg.context_parallel_size}}, 2}
  max_grad_norm: 1.0
  optimizer: null
  scheduler: null

  # ---------------------------------------------------------------------------
  # Generation (vLLM) Non-colocated, async
  # ---------------------------------------------------------------------------
  generation:
    port_range_low: 11001
    port_range_high: 15000
    backend: "vllm"
    max_new_tokens: ${policy.max_total_sequence_length}
    temperature: 1.0
    top_p: 1.0
    top_k: null
    stop_token_ids: null
    stop_strings: null
    # EP > TP blocked by https://github.com/NVIDIA-NeMo/RL/issues/1101.
    vllm_cfg:
      async_engine: true
      precision: ${policy.precision}
      kv_cache_dtype: "auto"
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      gpu_memory_utilization: 0.9567
      max_model_len: ${policy.max_total_sequence_length}
      enforce_eager: false
      use_deep_gemm: false
      num_last_layers_in_bf16: 0
      num_first_layers_in_bf16: 0
      enable_vllm_metrics_logger: true
      vllm_metrics_logger_interval: 0.5
      expose_http_server: true
      skip_tokenizer_init: false
      http_server_serving_chat_kwargs:
        enable_auto_tools: false  # no environment uses tools
        # tool_parser: "subconfigs_should_properly_configure_the vllm's tool_parser"
        reasoning_parser: "subconfigs_should_properly_configure_the vllm's reasoning_parser"
      trust_remote_code: true
    vllm_kwargs:
      # attention_backend: FLASH_ATTN  # most models can turn this one on, not GLM-4.7-Flash, though.
      # mamba_ssm_cache_dtype: "float32"  # for mamba models, e.g. Nemotron-3
    colocated:
      # 'colocated' variables are AUTOmatically set using the cluster information
      enabled: false
      resources:
        gpus_per_node: null
        num_nodes: null

# =============================================================================
# Data
# =============================================================================
data:
  max_input_seq_length: null
  shuffle: false  # input data is already shuffled
  num_workers: 1
  train:
    - data_path: null  # TODO: add path
  validation: null
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

# =============================================================================
# Environment NeMo Gym + Judge Models
# =============================================================================
env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  should_log_hashed_nemo_gym_responses: true
  nemo_gym:
    skip_venv_if_present: true
    port_range_low: 15001
    port_range_high: 20000
    global_aiohttp_connector_limit_per_host: 2048
    global_aiohttp_connector_limit: 1048576
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      # --- self-contained (no judge) --- #
      - resources_servers/code_gen/configs/code_gen.yaml
      - resources_servers/math_with_judge/configs/math_with_judge.yaml
      #  --- LLM Judge --- #
      - resources_servers/llm_judge_with_ground_truth/configs/llm_judge_with_ground_truth.yaml

    # Increase the num workers to help with the serialization/deserialization overhead of token IDs
    policy_model:
      responses_api_models:
        vllm_model:
          num_workers: 16
          num_groups_nemo_rl: ${add:${grpo.async_grpo.max_trajectory_age_steps}, 1}
          # Model-specific (Nemotron chat template): keep reasoning in multi-turn
          # history so the trajectory grows monotonically for token-in-token-out RL.
          chat_template_kwargs:
            enable_thinking: true
            truncate_history_thinking: false
          sequential_reasoning_allowed: false
    policy_model_reasoning_off:
      _copy: policy_model
      responses_api_models:
        vllm_model:
          num_workers: 1  # Can't disable it.
          num_groups_nemo_rl: ${add:${grpo.async_grpo.max_trajectory_age_steps}, 1}
          chat_template_kwargs:
            enable_thinking: false

    code_gen:
      resources_servers:
        code_gen:
          num_processes: 64
          unit_test_timeout_secs: 10
          debug: false

    math_with_judge:
      resources_servers:
        math_with_judge:
          num_processes: 8
          should_use_judge: false

    llm_judge_with_ground_truth:
      resources_servers:
        llm_judge_with_ground_truth:
          llm_judge_server_url: ${cluster.llm_judge.llm_judge_server_url}
          llm_judge_model: ${cluster.llm_judge.llm_judge_model}
          llm_judge_responses_create_params:
            temperature: 0.6
            top_p: 0.95
          llm_judge_endpoint_max_concurrency: 1024

# =============================================================================
# Logger
# =============================================================================
logger:
  num_val_samples_to_print: 0
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false
  monitor_gpus: false  # this errors out.. sometimes? best not to enable it
  swanlab_enabled: false
  wandb: {}
  tensorboard: {}
  mlflow: {}
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

infinite: 100000000
