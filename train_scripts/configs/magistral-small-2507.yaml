defaults: "core.yaml"

# =============================================================================
# Cluster
# =============================================================================
cluster:
  num_generation: 4
  num_training: 4

# =============================================================================
# GRPO Algorithm
# =============================================================================
grpo:
  seed: 2212

  # Advantage estimators
  advantage_estimator:
    name: "subconfigs_should_properly_configure_the advantage_estimator"
  # Advantage estimators: End

# =============================================================================
# Policy
# =============================================================================
policy:
  model_name: "subconfigs_should_properly_configure_the policy.model_name"
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs: null
  hf_config_overrides: {}

  megatron_cfg:
    empty_unused_memory_level: 2

    # Parallelism: 
    #   Reminder, Magistral-Small-2507 is a dense model
    tensor_model_parallel_size: 4
    context_parallel_size: 1

    optimizer:
      lr: 3.0e-7
      min_lr: ${policy.megatron_cfg.optimizer.lr}

    scheduler:
      lr_warmup_init: 3.0e-8
  # ---------------------------------------------------------------------------
  # Generation (vLLM) Non-colocated, async
  # ---------------------------------------------------------------------------
  generation:
    vllm_cfg:
      kv_cache_dtype: "auto"
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      http_server_serving_chat_kwargs:
        reasoning_parser: mistral
    vllm_kwargs:
      attention_backend: FLASH_ATTN
      max_num_seqs: 128
      max_num_batched_tokens: 131072
